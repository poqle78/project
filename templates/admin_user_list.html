<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Режим администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2>Режим администратора</h2>
        <p>Выберите пользователя, чтобы управлять его задачами:</p>
        
        <ul class="list-group">
            {% for user in users %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ user.username }}
                    <a href="{% url 'admin_impersonate_user' user.id %}" class="btn btn-outline-primary btn-sm">
                        Перейти
                    </a>
                </li>
            {% endfor %}
        </ul>

        <div class="mt-3">
            <a href="{% url 'task_list' %}" class="btn btn-secondary">← Вернуться к своим задачам</a>
        </div>
    </div>
</body>
</html>
